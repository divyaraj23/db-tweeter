version: "3.9"

services:
  api:
    build: ./tweetdbapi
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://tweetuser:tweetpass@db:5432/tweetdb
      JWT_SECRET_KEY: change-this-jwt-secret
      SECRET_KEY: change-this-flask-secret
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tweetdb
      POSTGRES_USER: tweetuser
      POSTGRES_PASSWORD: tweetpass
    volumes:
      - tweetdb-data:/var/lib/postgresql/data

volumes:
  tweetdb-data:
